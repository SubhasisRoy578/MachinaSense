services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: machinasense-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=${CORS_ORIGINS:?Set an explicit deployed frontend origin}
      - DATABASE_URL=${DATABASE_URL:?Set PostgreSQL DATABASE_URL}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL:?Set Clerk JWKS URL}
      # Add backend-only provider keys below if available:
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - GROK_API_KEY=${GROK_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: machinasense-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

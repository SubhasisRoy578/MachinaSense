services:
  - type: web
    name: machinasense-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: standard
    healthCheckPath: /health
    disk:
      name: machinasense-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://machinasense.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
